<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ebic Gift Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background-color: #0d0d12;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2d2b42;
        }

        .badge-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #232238;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .balance-box {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 11px;
            color: #8b8a9d;
        }

        .balance-value {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 800;
        }

        .deposit-btn {
            background: #7c52f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Live Items Bar */
        .live-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .live-badge {
            background: #1c1b29;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .item-icon {
            min-width: 44px;
            height: 44px;
            background: #191826;
            border: 1px solid #2b293d;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Container */
        .container {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .banner-card {
            position: relative;
            border-radius: 20px;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
            cursor: pointer;
        }

        .tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
        }

        .card-title {
            font-size: 26px;
            font-weight: 900;
            margin-top: 15px;
        }

        .card-rocket { background: linear-gradient(135deg, #4f83f7 0%, #3058d8 100%); }
        .card-pvp { background: linear-gradient(135deg, #f9a01b 0%, #e66200 100%); }
        .card-hub { background: linear-gradient(135deg, #7022f6 0%, #a212f3 100%); }

        /* Game Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 320px;
        }

        .rocket-area { font-size: 50px; margin: 15px 0; }
        .multiplier { font-size: 32px; font-weight: bold; color: #38bdf8; }
        
        .btn-game {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            color: white; font-size: 24px; cursor: pointer;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #12111d;
            border-top: 1px solid #232234;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #717084;
            font-size: 10px;
            text-decoration: none;
        }

        .nav-item.active-pill {
            background: #7c52f6;
            color: white;
            padding: 6px 16px;
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar-container">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=EbicGift" class="avatar" alt="User">
                <div class="badge-icon">💎</div>
            </div>
            <div class="balance-box">
                <span class="balance-label">Your balance</span>
                <div class="balance-value">💎 <span id="balance">100.00</span></div>
            </div>
        </div>
        <button class="deposit-btn">💎 Deposit</button>
    </div>

    <div class="live-bar">
        <div class="live-badge">● Live</div>
        <div class="item-icon">💰</div>
        <div class="item-icon">🧙‍♂️</div>
        <div class="item-icon">💎</div>
        <div class="item-icon">🏎️</div>
    </div>

    <div class="container">
        <div class="banner-card card-rocket" onclick="openGame()">
            <div class="tag">⚡ HOT!</div>
            <div class="card-title">🚀 ROCKET</div>
        </div>
        <div class="banner-card card-pvp">
            <div class="tag">⚔️ NEW!</div>
            <div class="card-title">⚔️ PVP</div>
        </div>
        <div class="banner-card card-hub">
            <div class="tag">🔥 HOT</div>
            <div class="card-title">🎮 PLAY HUB</div>
        </div>
    </div>

    <!-- Modal Game -->
    <div class="modal" id="gameModal">
        <span class="close-modal" onclick="closeGame()">✕</span>
        <div class="game-card">
            <div class="multiplier" id="multiplier">1.00x</div>
            <div class="rocket-area" id="rocket">🚀</div>
            <div id="status" style="margin-bottom:10px;">اضغط ابدأ اللعب</div>
            <button class="btn-game" id="actionBtn" onclick="handleClick()">🚀 ابدأ اللعب</button>
        </div>
    </div>

    <div class="navbar">
        <a href="#" class="nav-item">🎒 Backpack</a>
        <a href="#" class="nav-item">👥 Invite</a>
        <a href="#" class="nav-item active-pill">🏠 Home</a>
        <a href="#" class="nav-item">🏆 Leaderboard</a>
    </div>

<script>
    let balance = 100.00;
    let multiplier = 1.00;
    let isRunning = false;
    let timer = null;

    function openGame() {
        document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
        document.getElementById('gameModal').style.display = 'none';
        clearInterval(timer);
        isRunning = false;
    }

    function handleClick() {
        if (!isRunning) {
            if (balance < 5) {
                alert("رصيدك لا يكفي!");
                return;
            }
            balance -= 5;
            document.getElementById('balance').innerText = balance.toFixed(2);
            isRunning = true;
            multiplier = 1.00;
            let crashPoint = (Math.random() * 4 + 1.2).toFixed(2);

            document.getElementById('actionBtn').innerText = "💰 سحب الأرباح!";
            document.getElementById('status').innerText = "الصاروخ ينطلق...";

            timer = setInterval(() => {
                multiplier += 0.04;
                document.getElementById('multiplier').innerText = multiplier.toFixed(2) + "x";

                if (multiplier >= crashPoint) {
                    clearInterval(timer);
                    isRunning = false;
                    document.getElementById('actionBtn').innerText = "🚀 حاول مجدداً";
                    document.getElementById('status').innerText = "💥 انفجر الصاروخ!";
                    document.getElementById('rocket').innerText = "💥";
                    setTimeout(() => { document.getElementById('rocket').innerText = "🚀"; }, 1500);
                }
            }, 100);
        } else {

          
            clearInterval(timer);
            isRunning = false;
            let win = 5 * multiplier;
            balance += win;
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('actionBtn').innerText = "🚀 ابدأ اللعب";
            document.getElementById('status').innerText = `🎉 ربحت ${win.toFixed(2)} TON!`;
        }
    }
</script>
</body>
</html>

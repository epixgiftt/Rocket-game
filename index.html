<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rocket Crash Live</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        .game-card { width: 100%; max-width: 400px; padding: 15px; }
        .header { display: flex; justify-content: space-between; background: #151c2c; padding: 12px 20px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; }
        canvas { background: #05070f; border-radius: 16px; border: 1px solid #1e293b; width: 100%; height: 260px; }
        .controls { background: #151c2c; padding: 15px; border-radius: 16px; margin-top: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; color: #fff; background: #22c55e; transition: 0.2s; }
        .btn-cashout { background: #eab308; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header">
        <span>الرصيد:</span>
        <span id="bal" style="color:#38bdf8">100.00 TON</span>
    </div>

    <!-- شاشة الأنيميشن الحقيقية -->
    <canvas id="spaceCanvas"></canvas>

    <div class="controls">
        <button id="mainBtn" class="btn" onclick="triggerAction()">🚀 ابدأ الانطلاق</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let balance = 100.00;
    let state = "IDLE"; // IDLE, FLYING, CRASHED
    let multiplier = 1.00;
    let crashPoint = 0;
    let rocketX = 30, rocketY = canvas.height - 30;
    let stars = Array.from({length: 40}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2}));

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // رسم النجوم
        ctx.fillStyle = "#ffffff";
        stars.forEach(st => {
            ctx.fillRect(st.x, st.y, st.s, st.s);
            if (state === "FLYING") {
                st.y += 2;
                if (st.y > canvas.height) st.y = 0;
            }
        });

        // رسم المنحنى
        if (state === "FLYING") {
            ctx.beginPath();
            ctx.strokeStyle = "#0088cc";
            ctx.lineWidth = 3;
            ctx.moveTo(30, canvas.height - 30);
            ctx.quadraticCurveTo(canvas.width / 2, canvas.height - 30, rocketX, rocketY);
            ctx.stroke();
        }

        // رسم الصاروخ
        ctx.font = "30px Arial";
        if (state === "CRASHED") {
            ctx.fillText("💥", rocketX - 15, rocketY + 10);
        } else {
            ctx.fillText("🚀", rocketX - 15, rocketY + 10);
        }

        // رسم العداد الرقمي
        ctx.fillStyle = state === "CRASHED" ? "#ef4444" : "#38bdf8";
        ctx.font = "bold 32px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(multiplier.toFixed(2) + "x", canvas.width / 2, 50);

        requestAnimationFrame(draw);
    }

    function triggerAction() {
        const btn = document.getElementById('mainBtn');
        if (state === "IDLE" || state === "CRASHED") {
            state = "FLYING";
            multiplier = 1.00;
            crashPoint = (Math.random() * 4 + 1.1).toFixed(2);
            rocketX = 30;
            rocketY = canvas.height - 30;
            balance -= 2;
            document.getElementById('bal').innerText = balance.toFixed(2) + " TON";

            btn.innerText = "💰 كاش أوت (سحب)";
            btn.className = "btn btn-cashout";

            let loop = setInterval(() => {
                if (state !== "FLYING") { clearInterval(loop); return; }
                multiplier += 0.03;
                rocketX = Math.min(canvas.width - 40, rocketX + 1.5);
                rocketY = Math.max(70, rocketY - 1.2);

                if (multiplier >= crashPoint) {
                    clearInterval(loop);
                    state = "CRASHED";
                    btn.innerText = "💥 انكسر الصاروخ! حاول مجدداً";
                    btn.className = "btn btn-danger";
                }
            }, 80);
        } else if (state === "FLYING") {
            state = "IDLE";
            let win = 2 * multiplier;
            balance += win;
            document.getElementById('bal').innerText = balance.toFixed(2) + " TON";
            btn.innerText = `🎉 ربحت ${win.toFixed(2)} TON! جولة جديدة`;
            btn.className = "btn";
        }
    }

    draw();
</script>
</body>
</html>

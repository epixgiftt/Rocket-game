<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .rocket-area {
            font-size: 60px;
            margin: 20px 0;
            transition: transform 0.1s linear;
        }
        .multiplier {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
        }
        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn-cashout {
            background: #eab308;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            height: 20px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="rocket-area" id="rocket">🚀</div>
    <div class="status" id="status">اضغط ابدأ لبدء الجولة</div>
    <button class="btn" id="actionBtn" onclick="handleClick()">🚀 ابدأ اللعب</button>
</div>

<script>
    let multiplier = 1.00;
    let isRunning = false;
    let crashPoint = 0;
    let timer = null;

    const multElement = document.getElementById('multiplier');
    const rocketElement = document.getElementById('rocket');
    const btnElement = document.getElementById('actionBtn');
    const statusElement = document.getElementById('status');

    function handleClick() {
        if (!isRunning) {
            startGame();
        } else {
            cashOut();
        }
    }

    function startGame() {
        isRunning = true;
        multiplier = 1.00;
        crashPoint = (Math.random() * 7 + 1.1).toFixed(2);
        
        btnElement.innerText = "💰 سحب الأرباح!";
        btnElement.className = "btn btn-cashout";
        statusElement.innerText = "الصاروخ ينطلق...";
        statusElement.style.color = "#38bdf8";

        timer = setInterval(() => {
            multiplier += 0.03;
            multElement.innerText = multiplier.toFixed(2) + "x";
            
            let translateY = Math.min((multiplier - 1) * 15, 60);
            rocketElement.style.transform = `translateY(-${translateY}px)`;

            if (multiplier >= crashPoint) {
                crashGame();
            }
        }, 100);
    }

    function cashOut() {
        clearInterval(timer);
        isRunning = false;
        btnElement.innerText = "🚀 ابدأ اللعب";
        btnElement.className = "btn";
        statusElement.innerText = `🎉 نجحت بالسحب عند ${multiplier.toFixed(2)}x!`;
        statusElement.style.color = "#22c55e";
        rocketElement.style.transform = "translateY(0px)";
    }

    function crashGame() {
        clearInterval(timer);
        isRunning = false;
        btnElement.innerText = "🚀 حاول مجدداً";
        btnElement.className = "btn";
        statusElement.innerText = "💥 انفجر الصاروخ! خسرت الجولة.";
        statusElement.style.color = "#ef4444";
        rocketElement.innerText = "💥";
        
        setTimeout(() => {
            rocketElement.innerText = "🚀";
            rocketElement.style.transform = "translateY(0px)";
            multElement.innerText = "1.00x";
        }, 1500);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الصاروخ 3D الحقيقية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0e14; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* قائمة المشاركين الجانبية */
        #sidebar {
            width: 300px;
            background: #151921;
            border-left: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 10;
        }
        #sidebar h3 { font-size: 16px; margin-bottom: 15px; color: #8890a4; border-bottom: 1px solid #2a2e39; padding-bottom: 10px; }
        .player-list { flex: 1; overflow-y: auto; }
        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #1c212c;
            border-radius: 6px;
            font-size: 14px;
        }
        .player-info { display: flex; flex-direction: column; }
        .player-name { font-weight: bold; color: #e1e4ea; }
        .player-bet { font-size: 12px; color: #8890a4; }
        .player-status { font-weight: bold; }
        .status-win { color: #10b981; }
        .status-lost { color: #ef4444; }
        .status-playing { color: #f59e0b; }

        /* منطقة اللعبة الرئيسية */
        #game-container { flex: 1; position: relative; }
        #canvas-3d { width: 100%; height: 100%; display: block; }

        /* واجهة النتيجة والمضاعف فوق اللعبة */
        #hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        #multiplier {
            font-size: 72px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: color 0.3s ease;
        }
        #status-text { font-size: 24px; font-weight: bold; margin-top: 10px; }

        /* شريط التحكم السفلي */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(21, 25, 33, 0.9);
            padding: 15px 30px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #2a2e39;
        }
        input[type="number"] {
            background: #0b0e14;
            border: 1px solid #2a2e39;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 100px;
            text-align: center;
        }
        button {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        button.cashout { background: #f59e0b; }
    </style>
    <!-- مكتبة Three.js للرسومات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- قائمة المشاركين -->
    <div id="sidebar">
        <h3>المشاركون في الجولة (<span id="player-count">0</span>)</h3>
        <div class="player-list" id="players-container"></div>
    </div>

    <!-- شاشة اللعبة 3D -->
    <div id="game-container">
        <canvas id="canvas-3d"></canvas>
        <div id="hud">
            <div id="multiplier" style="color: #10b981;">1.00x</div>
            <div id="status-text"></div>
        </div>

        <div id="controls">
            <label>الرهان:</label>
            <input type="number" id="bet-amount" value="10" min="1">
            <button id="btn-action" onclick="handleAction()">دخول الجولة</button>
        </div>
    </div>

<script>
    // ----------------------------------------------------
    // 1. إعداد بيئة Three.js ثلاثية الأبعاد للصاروخ
    // ----------------------------------------------------
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.015);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);

    // الإضاءة
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // بناء مجسم الصاروخ (Rocket 3D)
    const rocketGroup = new THREE.Group();
    
    // جسم الصاروخ
    const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 16);
    const rocketMaterial = new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.8, roughness: 0.2 });
    const rocketBody = new THREE.Mesh(bodyGeo, rocketMaterial);
    rocketGroup.add(rocketBody);

    // رأس الصاروخ
    const noseGeo = new THREE.ConeGeometry(0.3, 0.6, 16);
    const noseMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const nose = new THREE.Mesh(noseGeo, noseMat);
    nose.position.y = 1.3;
    rocketGroup.add(nose);

    // أجنحة الصاروخ
    const finGeo = new THREE.BoxGeometry(0.1, 0.5, 0.8);
    const finMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    for(let i=0; i<3; i++){
        const fin = new THREE.Mesh(finGeo, finMat);
        fin.position.y = -0.7;
        fin.rotation.y = (i * Math.PI * 2) / 3;
        fin.position.x = Math.sin((i * Math.PI * 2) / 3) * 0.35;
        fin.position.z = Math.cos((i * Math.PI * 2) / 3) * 0.35;
        rocketGroup.add(fin);
    }

    // نار المحرك (Particles)
    const fireGeo = new THREE.ConeGeometry(0.25, 0.8, 16);
    const fireMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
    const fire = new THREE.Mesh(fireGeo, fireMat);
    fire.position.y = -1.4;
    fire.rotation.x = Math.PI;
    rocketGroup.add(fire);

    rocketGroup.rotation.z = -Math.PI / 4; // إمالة الصاروخ بزاوية طيران
    scene.add(rocketGroup);

    // إضافة نجوم بالخلفية للواقعية
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 800;
    const starPositions = new Float32Array(starsCount * 3);
    for(let i=0; i<starsCount*3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 100;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    camera.position.set(0, 0, 7);

    // ----------------------------------------------------
    // 2. منطق اللعبة والألوان والحسابات
    // ----------------------------------------------------
    let currentMultiplier = 1.00;
    let crashMultiplier = 0;
    let gameState = 'WAITING'; // WAITING, RUNNING, CRASHED
    let userBet = false;
    let userCashedOut = false;
    let gameInterval;

    // قائمة أسماء وهمية لتغيير المشاركين ديناميكياً
    const botNames = ["علي_الجوكر", "سامر_الكابتن", "كرار_99", "أمير_العراق", "مصطفى_VIP", "حسين_الأسد", "أحمد_البرنس"];
    let players = [];

    function updateColor(multiplier) {
        let currentColorHex = 0x10b981; // أخضر default
        let colorCSS = '#10b981';

        if (multiplier >= 1.00 && multiplier < 2.00) {
            currentColorHex = 0x10b981; // أخضر (1 - 2)
            colorCSS = '#10b981';
        } else if (multiplier >= 2.00 && multiplier < 5.00) {
            currentColorHex = 0x2563eb; // أزرق (2 - 5)
            colorCSS = '#2563eb';
        } else if (multiplier >= 5.00 && multiplier < 8.00) {
            currentColorHex = 0x9333ea; // بنفسجي (5 - 8)
            colorCSS = '#9333ea';
        } else if (multiplier >= 8.00) {
            currentColorHex = 0xf59e0b; // ذهبي (8+)
            colorCSS = '#f59e0b';
        }

        // تحديث لون الصاروخ والمؤشر
        rocketMaterial.color.setHex(currentColorHex);
        document.getElementById('multiplier').style.color = colorCSS;
    }

    function generatePlayers() {
        players = [
            { name: "أنت (الحساب)", bet: parseInt(document.getElementById('bet-amount').value), cashedOut: false, win: 0 }
        ];
        const count = Math.floor(Math.random() * 4) + 3;
        for(let i=0; i<count; i++) {
            players.push({
                name: botNames[Math.floor(Math.random() * botNames.length)],
                bet: Math.floor(Math.random() * 50) + 5,
                cashedOut: false,
                cashOutAt: (Math.random() * 7 + 1.1).toFixed(2),
                win: 0
            });
        }
        renderPlayers();
    }

    function renderPlayers() {
        const container = document.getElementById('players-container');
        container.innerHTML = '';
        document.getElementById('player-count').innerText = players.length;

        players.forEach(p => {
            const card = document.createElement('div');
            card.className = 'player-card';
            
            let statusText = p.cashedOut ? `ربح $${p.win}` : 'يلعب...';
            let statusClass = p.cashedOut ? 'status-win' : 'status-playing';
            
            if(gameState === 'CRASHED' && !p.cashedOut) {
                statusText = 'خسر';
                statusClass = 'status-lost';
            }

            card.innerHTML = `
                <div class="player-info">
                    <span class="player-name">${p.name}</span>
                    <span class="player-bet">الرهان: $${p.bet}</span>
                </div>
                <div class="player-status ${statusClass}">${statusText}</div>
            `;
            container.appendChild(card);
        });
    }

    function startGame() {
        gameState = 'RUNNING';
        currentMultiplier = 1.00;
        userCashedOut = false;
        
        // نقطة الانفجار (الطقّة) الحقيقية العشوائية
        crashMultiplier = (Math.random() * 9 + 1).toFixed(2); 

        document.getElementById('status-text').innerText = '';
        document.getElementById('btn-action').disabled = false;
        
        if(userBet) {
            document.getElementById('btn-action').innerText = 'سحب الأرباح (Cashout)';
            document.getElementById('btn-action').className = 'cashout';
        } else {
            document.getElementById('btn-action').disabled = true;
            document.getElementById('btn-action').innerText = 'الجولة مستمرة...';
        }

        generatePlayers();

        gameInterval = setInterval(() => {
            currentMultiplier += 0.01 + (currentMultiplier * 0.002); // تسارع
            document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
            
            updateColor(currentMultiplier);

            // تحديث البوتات الحقيقيين
            players.forEach(p => {
                if(!p.cashedOut && p.cashOutAt && currentMultiplier >= p.cashOutAt) {
                    p.cashedOut = true;
                    p.win = (p.bet * p.cashOutAt).toFixed(2);
                }
            });
            renderPlayers();

            // فحص الانفجار (الطقّة)
            if (currentMultiplier >= crashMultiplier) {
                crashGame();
            }
        }, 50);
    }

    function crashGame() {
        clearInterval(gameInterval);
        gameState = 'CRASHED';
        
        document.getElementById('multiplier').innerText = 'طك الصاروخ! 💥';
        document.getElementById('multiplier').style.color = '#ef4444';
        document.getElementById('status-text').innerText = `انفجر عند ${crashMultiplier}x`;
        
        document.getElementById('btn-action').className = '';
        document.getElementById('btn-action').innerText = 'دخول الجولة التالية';
        document.getElementById('btn-action').disabled = false;
        
        userBet = false;
        renderPlayers();

        // إعادة تشغيل تلقائي بعد 4 ثوانٍ
        setTimeout(() => {
            if(gameState === 'CRASHED') startGame();
        }, 4000);
    }

    function handleAction() {
        if(gameState === 'RUNNING' && userBet && !userCashedOut) {
            // سحب الأرباح
            userCashedOut = true;
            const winAmount = (parseInt(document.getElementById('bet-amount').value) * currentMultiplier).toFixed(2);
            players[0].cashedOut = true;
            players[0].win = winAmount;
            
            document.getElementById('btn-action').disabled = true;
            document.getElementById('btn-action').innerText = `تم السحب: $${winAmount}`;
            renderPlayers();
        } else if(gameState !== 'RUNNING') {
            // تجهيز الدخول للجولة القادمة
            userBet = true;
            document.getElementById('btn-action').innerText = 'في الانتظار...';
            document.getElementById('btn-action').disabled = true;
        }
    }

    // ----------------------------------------------------
    // 3. تحريك المشهد الـ 3D باستمرار
    // ----------------------------------------------------
    function animate() {
        requestAnimationFrame(animate);

        if(gameState === 'RUNNING') {
            // اهتزاز وحركة الصاروخ أثناء الطيران
            rocketGroup.position.y = Math.sin(Date.now() * 0.005) * 0.2;
            rocketGroup.position.x = Math.cos(Date.now() * 0.003) * 0.1;
            fire.scale.set(1, 1 + Math.random() * 0.5, 1); // اهتزاز النار
            starField.position.y -= 0.2; // تحرك النجوم لإعطاء شعور بالسرعة
            if(starField.position.y < -20) starField.position.y = 0;
        } else if(gameState === 'CRASHED') {
            fire.scale.set(0, 0, 0); // إطفاء المحرك عند الطقّة
        }

        renderer.render(scene, camera);
    }

    // بدء اللعبة والتعديل مع تغيير حجم الشاشة
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    animate();
    startGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Epic Gift - Rocket & Fake Gifts Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background: #0c0f17; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }

        .app-container { width: 100%; max-width: 420px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        /* Header Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #161b26; border-radius: 12px; border: 1px solid #232a3b; }
        .balance-badge { background: #1e2638; border: 1px solid #0088cc; border-radius: 20px; padding: 4px 12px; display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 14px; }
        .balance-badge i { color: #0088cc; }

        /* Multiplier Ribbon */
        .history-ribbon { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .history-ribbon::-webkit-scrollbar { display: none; }
        .history-chip { background: #1c2433; border: 1px solid #2d384e; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #38bdf8; white-space: nowrap; }
        .history-chip.high { color: #f59e0b; border-color: #f59e0b; }

        /* Game Stage Area */
        .game-stage { position: relative; width: 100%; height: 240px; background: radial-gradient(circle at bottom, #172033 0%, #090c14 100%); border-radius: 16px; border: 1px solid #232a3b; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Countdown Overlay */
        .countdown-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
        .countdown-circle { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #10b981; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; color: #fff; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); animation: ringPulse 1s infinite alternate; }
        @keyframes ringPulse { 0% { transform: scale(0.96); } 100% { transform: scale(1.04); } }

        /* Multiplier Badge */
        .live-multiplier { position: absolute; top: 12px; left: 12px; background: rgba(0, 136, 204, 0.2); border: 1px solid #0088cc; padding: 4px 12px; border-radius: 8px; font-size: 18px; font-weight: 900; color: #38bdf8; z-index: 5; }

        /* Primary Action Buttons */
        .btn-bet { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 18px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .btn-bet.cashout { background: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }

        /* Fake Gifts Market / Inventory */
        .inventory-section { background: #131824; border-radius: 14px; border: 1px solid #1e2638; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .inventory-title { font-size: 13px; font-weight: bold; color: #94a3b8; display: flex; justify-content: space-between; }
        .gifts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 180px; overflow-y: auto; }
        .gift-card { background: #1a2233; border: 1px solid #2b354a; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .gift-icon { font-size: 28px; }
        .gift-name { font-size: 12px; font-weight: bold; }
        .gift-price { font-size: 11px; color: #38bdf8; font-weight: bold; }
        .btn-sell { background: #10b981; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; width: 100%; }

        /* Live Players Feed */
        .feed-container { background: #131824; border-radius: 14px; border: 1px solid #1e2638; padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #1a2233; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
